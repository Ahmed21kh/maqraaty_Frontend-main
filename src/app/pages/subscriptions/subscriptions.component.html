<div class=" w-full ">
  <app-page-header icon="dollar" subtitle="اختر الطالب لعرض حساب اشتراكاته"></app-page-header>
  <nz-row [nzGutter]="10">
   <nz-col [nzSpan]="24">
     <nz-card nzTitle="حساب الطالب" nzBordered class=" !rounded-md !my-4 shadow-md" >
       <app-student-select size="large" [ngModel]="selectedVal" (ngModelChange)="onSelect($event)" />
     </nz-card>


  </nz-col>
 </nz-row>
 @if (selectedId) {
   <app-student-payment-details [embeddedId]="selectedId" />
 } @else {
   <div class="app-card mt-2 py-10">
     <app-empty-state icon="user" title="لم يتم اختيار طالب" description="اختر اسم الطالب من القائمة بالاعلى لعرض حساب اشتراكاته وسجل مدفوعاته" />
   </div>
 }
</div>
